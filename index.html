<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TriSync</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
    * { font-family: 'Tajawal', sans-serif; touch-action: manipulation; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

  <!-- 1. شاشة تسجيل الدخول -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/95 backdrop-blur-xl">
    <div class="glass-card w-full max-w-sm p-6 rounded-3xl text-center space-y-6 border border-cyan-500/20 shadow-2xl">
      <div class="space-y-1">
        <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-emerald-400 to-purple-500 bg-clip-text text-transparent">TriSync</h1>
        <p class="text-xs text-gray-400">اختر حسابك وادخل رمز الـ PIN</p>
      </div>

      <div class="space-y-4 text-right">
        <div>
          <label class="block text-xs text-gray-400 mb-1 font-medium">المستخدم</label>
          <select id="user-select" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500">
            <option value="محمد">محمد (🌊 طرطوس)</option>
            <option value="مصطفى">مصطفى (🇸🇾 سوريا)</option>
            <option value="شهد">شهد (🇸🇪 السويد)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1 font-medium">رمز الـ PIN</label>
          <input id="pin-input" type="password" maxlength="4" placeholder="1234" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-base tracking-widest text-white focus:outline-none focus:border-cyan-500">
          <p id="pin-error" class="text-red-400 text-[10px] mt-1 hidden text-center">الرمز غير صحيح!</p>
        </div>

        <button onclick="loginWithAccount()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl font-bold text-black text-xs hover:opacity-90 active:scale-95 transition shadow-lg shadow-cyan-500/20">
          دخول
        </button>
      </div>
    </div>
  </div>

  <!-- 2. محتوى التطبيق -->
  <div id="app-content" class="hidden flex-col min-h-screen pb-20">

    <!-- الهيدر -->
    <header class="glass-card sticky top-0 z-40 px-4 py-3 border-b border-white/10 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div id="current-user-avatar-container" class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 overflow-hidden">
          <span>⚓</span>
        </div>
        <div>
          <h2 id="current-user-name" class="font-bold text-xs text-gray-100">محمد</h2>
          <p id="user-points" class="text-[10px] text-emerald-400 font-medium">👑 (150 نقطة)</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openEditProfileModal()" class="px-3 py-1.5 bg-gray-800/80 border border-gray-700/50 rounded-xl text-xs text-gray-200 hover:text-white flex items-center gap-1">
          ⚙️ البروفايل
        </button>
      </div>
    </header>

    <!-- التبويب 1: الخريطة -->
    <main id="tab-globe" class="tab-content flex-1 flex flex-col relative overflow-hidden">
      <div class="absolute top-3 right-3 left-3 z-10 flex justify-between items-center pointer-events-none">
        <span class="bg-gray-900/80 border border-white/10 px-3 py-1 rounded-full text-[10px] text-gray-300 backdrop-blur-md">
          🌍 اسحب الكرة باللمس لتدويرها
        </span>
      </div>

      <div id="globe-container" class="w-full h-[55vh] relative"></div>
      <div id="html-markers-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>
    </main>

    <!-- التبويب 2: الدردشة -->
    <main id="tab-shadow" class="tab-content hidden flex-1 p-4 flex-col max-w-lg mx-auto w-full space-y-3">
      <div class="glass-card p-3 rounded-2xl border border-purple-500/20 text-center">
        <h3 class="font-bold text-purple-400 text-xs">💬 المحادثة المشتركة</h3>
        <p class="text-[10px] text-gray-400">تواصل مباشر بين الأصدقاء</p>
      </div>

      <div id="chat-box" class="flex-1 bg-gray-900/60 rounded-2xl border border-white/5 p-3 overflow-y-auto space-y-2 min-h-[280px] max-h-[45vh] custom-scroll">
      </div>

      <div class="flex gap-2">
        <input id="chat-input" type="text" placeholder="اكتب رسالة..." class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
        <button onclick="sendChatMessage()" class="px-4 py-2 bg-purple-600 rounded-xl text-xs font-bold text-white hover:bg-purple-500 active:scale-95 transition">إرسال</button>
      </div>
    </main>

    <!-- التبويب 3: التحديات -->
    <main id="tab-challenges" class="tab-content hidden flex-1 p-4 max-w-lg mx-auto w-full space-y-3">
      <div class="glass-card p-4 rounded-2xl border border-emerald-500/20 space-y-3">
        <span class="text-[10px] font-bold bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">تحدي الأسبوع 🔥</span>
        <h3 class="font-bold text-xs text-gray-100">شاركنا صورة لمنظرك الحالي 🌅</h3>
        <p class="text-[11px] text-gray-400">+50 نقطة عند إكمال التحدي</p>

        <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-700 hover:border-emerald-500 rounded-xl p-4 cursor-pointer transition bg-gray-900/40">
          <span class="text-xl mb-1">📸</span>
          <span class="text-xs text-gray-300">رفع صورة للتحدي</span>
          <input type="file" accept="image/*" class="hidden" onchange="previewChallengePhoto(event)">
        </label>

        <div id="challenge-preview-box" class="hidden">
          <img id="challenge-preview-img" class="w-full h-36 object-cover rounded-xl border border-emerald-500/40">
          <p class="text-xs text-emerald-400 text-center mt-2 font-bold">🎉 تم إضافة 50 نقطة لحسابك!</p>
        </div>
      </div>
    </main>

    <!-- التبويب 4: اقتراحات الأفلام -->
    <main id="tab-movies" class="tab-content hidden flex-1 p-4 max-w-lg mx-auto w-full space-y-3">
      <div class="glass-card p-4 rounded-2xl border border-amber-500/20 text-center space-y-3">
        <h3 class="font-bold text-amber-400 text-xs">🎬 اقتراح فيلم عشوائي</h3>
        
        <button onclick="generateRandomMovie()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-black font-bold rounded-xl text-xs active:scale-95 transition">
          🎲 اقترح لي فيلماً!
        </button>

        <div id="movie-card" class="hidden p-3 bg-gray-900/90 rounded-xl border border-amber-500/30 space-y-1 text-right">
          <h4 id="movie-title" class="font-bold text-amber-300 text-xs"></h4>
          <p id="movie-genre" class="text-[11px] text-gray-300"></p>
          <p id="movie-rating" class="text-[11px] font-bold text-emerald-400"></p>
        </div>

        <button onclick="toggleAllMoviesList()" class="text-xs text-gray-400 hover:text-white underline pt-1 block mx-auto">
          عرض قائمة الأفلام
        </button>

        <div id="all-movies-container" class="hidden text-right space-y-1.5 max-h-48 overflow-y-auto custom-scroll pr-1"></div>
      </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="glass-card fixed bottom-0 inset-x-0 z-40 border-t border-white/10 py-2 px-4 flex justify-around items-center">
      <button onclick="switchTab('globe', this)" class="nav-btn text-cyan-400 flex flex-col items-center gap-1">
        <span class="text-base">🌍</span>
        <span class="text-[10px]">الخريطة</span>
      </button>
      <button onclick="switchTab('shadow', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1">
        <span class="text-base">💬</span>
        <span class="text-[10px]">الدردشة</span>
      </button>
      <button onclick="switchTab('challenges', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1">
        <span class="text-base">🏆</span>
        <span class="text-[10px]">التحديات</span>
      </button>
      <button onclick="switchTab('movies', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1">
        <span class="text-base">🎬</span>
        <span class="text-[10px]">أفلام</span>
      </button>
    </nav>
  </div>

  <!-- مودال تعديل البروفايل -->
  <div id="profile-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="glass-card w-full max-w-xs p-5 rounded-3xl space-y-3 border border-cyan-500/30">
      <h3 class="font-bold text-center text-xs text-cyan-400">تعديل الملف الشخصي</h3>
      
      <div class="space-y-2 text-right">
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">الاسم</label>
          <input id="edit-name-input" type="text" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white">
        </div>
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">تاريخ الميلاد</label>
          <input id="edit-birthdate-input" type="date" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white">
        </div>
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">الصورة الشخصية</label>
          <input id="edit-image-file" type="file" accept="image/*" class="w-full text-[10px] text-gray-400 bg-gray-900 border border-gray-800 rounded-lg p-1.5">
        </div>
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">رمز PIN الجديد</label>
          <input id="edit-pin-input" type="password" maxlength="4" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-center text-white">
        </div>
        
        <button onclick="updateMyLocationGPS()" class="w-full py-2 bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 font-bold text-xs rounded-xl hover:bg-emerald-600/30 transition flex items-center justify-center gap-1">
          📍 تحديث موقعي الحالي (GPS)
        </button>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="saveProfileChanges()" class="flex-1 py-2 bg-cyan-500 text-black font-bold text-xs rounded-xl active:scale-95 transition">حفظ</button>
        <button onclick="closeEditProfileModal()" class="flex-1 py-2 bg-gray-800 text-gray-300 text-xs rounded-xl active:scale-95 transition">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=2000"></script>
</body>
        </html>
