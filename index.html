<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriSync - المنصة المحدثة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #030712; color: white; overflow-x: hidden; }
    .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="bg-gray-950 min-h-screen">

  <!-- Login Screen -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950">
    <div class="glass-card w-full max-w-sm p-6 rounded-3xl text-center">
      <h1 class="text-3xl font-black text-cyan-400 mb-6">TriSync</h1>
      <select id="user-select" class="w-full bg-gray-900 p-3 rounded-xl mb-4 text-black">
        <option value="محمد">محمد</option>
        <option value="مصطفى">مصطفى</option>
        <option value="شهد">شهد</option>
      </select>
      <input id="pin-input" type="password" placeholder="PIN (1234)" class="w-full bg-gray-900 p-3 rounded-xl mb-4 text-center">
      <button onclick="loginWithAccount()" class="w-full py-3 bg-cyan-500 rounded-xl font-bold text-black">دخول</button>
    </div>
  </div>

  <!-- App Main Content -->
  <div id="app-content" class="hidden flex flex-col min-h-screen pb-20">
    <header class="p-4 flex justify-between items-center glass-card">
      <h2 id="current-user-name" class="font-bold">محمد</h2>
      <button onclick="openEditProfileModal()" class="bg-gray-800 p-2 rounded-lg">⚙️ البروفايل</button>
    </header>

    <main id="tab-globe" class="flex-1 relative overflow-hidden">
      <div id="globe-container" class="w-full h-[50vh]"></div>
      <div id="html-markers-container" class="absolute inset-0 pointer-events-none z-20"></div>
    </main>

    <!-- Chat Box -->
    <div class="p-4 flex-1">
      <div id="chat-box" class="h-60 overflow-y-auto bg-gray-900 rounded-xl p-3 mb-2 space-y-2"></div>
      <div class="flex gap-2">
        <input id="chat-input" class="flex-1 bg-gray-800 p-2 rounded-lg" placeholder="اكتب رسالة...">
        <button onclick="sendMessage()" class="bg-cyan-600 px-4 rounded-lg">إرسال</button>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80">
    <div class="glass-card w-80 p-6 rounded-2xl space-y-4">
      <h3 class="text-center font-bold">تعديل الملف</h3>
      <input id="edit-name" class="w-full bg-gray-900 p-2 rounded" placeholder="الاسم">
      <input id="edit-birthdate" type="date" class="w-full bg-gray-900 p-2 rounded">
      <input id="edit-photo-input" type="file" accept="image/*" class="w-full text-xs">
      <button onclick="updateMyLocation()" class="w-full py-2 bg-emerald-600 rounded-lg">تحديث موقعي (GPS)</button>
      <div class="flex gap-2">
        <button onclick="saveProfileChanges()" class="flex-1 py-2 bg-cyan-500 rounded-lg">حفظ</button>
        <button onclick="closeEditProfileModal()" class="flex-1 py-2 bg-gray-700 rounded-lg">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
